version: "3.9"

services:
  postgres:
    image: postgres:14
    container_name: quickdocs_postgres
    restart: always
    environment:
      POSTGRES_USER: admindocs
      POSTGRES_PASSWORD: rVl20$s&]WiZ~F:
      POSTGRES_DB: docs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: quickdocs_redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdocs_app
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

volumes:
  postgres_data:
